name: PR checks

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          # npm ci runs dependency install scripts; keep the token out of
          # .git/config. The repository is public, so the LFS pull needs none.
          persist-credentials: false

      # The build imports the images under src/images (the 404 page, the hero
      # logo); public/ is copied as-is and its LFS objects are not needed here.
      - name: Pull the LFS images the build imports
        run: |
          git lfs install --local
          git lfs pull --include="src/images/**"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # next build directly: the npm lifecycle hooks optimize every image in
      # public/ and write the sitemap, which only the deploy needs.
      # A placeholder form id, so the page renders the EmailOctopus branch the
      # deploy renders, not the "form unavailable" fallback.
      - name: Build (static export, type check included)
        run: npx next build
        env:
          NEXT_PUBLIC_EMAILOCTOPUS_FORM_ID: pr-check-form-id

      - name: Tests
        run: node --test tests/static-export-mail-routes.test.mjs
        env:
          REQUIRE_BUILD_MANIFEST: '1'
          EXPECT_EMAILOCTOPUS_FORM_ID: pr-check-form-id
